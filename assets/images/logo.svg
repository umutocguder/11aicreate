<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="darkAperture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e15" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#darkAperture)" stroke="#1e2238" stroke-width="6" />

  <!-- Outer Neural Ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#cyberNeon)" stroke-width="4" stroke-dasharray="16 12" opacity="0.45" />

  <!-- Dynamic Creative Aperture Rays -->
  <path d="M 256 80 L 330 180 L 256 220 L 182 180 Z" fill="url(#cyberNeon)" opacity="0.3" filter="url(#neonGlow)" />
  <path d="M 432 256 L 332 330 L 292 256 L 332 182 Z" fill="url(#cyberNeon)" opacity="0.3" filter="url(#neonGlow)" />
  <path d="M 256 432 L 182 332 L 256 292 L 330 332 Z" fill="url(#cyberNeon)" opacity="0.3" filter="url(#neonGlow)" />
  <path d="M 80 256 L 180 182 L 220 256 L 180 330 Z" fill="url(#cyberNeon)" opacity="0.3" filter="url(#neonGlow)" />

  <!-- Iconic 11 AI Monogram Pillars -->
  <!-- Pillar 1 -->
  <path d="M 184 140 L 224 140 L 224 372 L 184 372 Z" fill="url(#cyberNeon)" rx="8" filter="url(#neonGlow)" />
  <path d="M 152 180 L 184 140 L 184 180 Z" fill="url(#cyberNeon)" />
  <circle cx="204" cy="116" r="12" fill="#00f0ff" filter="url(#neonGlow)" />

  <!-- Pillar 2 -->
  <path d="M 288 140 L 328 140 L 328 372 L 288 372 Z" fill="url(#cyberNeon)" rx="8" filter="url(#neonGlow)" />
  <path d="M 256 180 L 288 140 L 288 180 Z" fill="url(#cyberNeon)" />
  <circle cx="308" cy="116" r="12" fill="#ec4899" filter="url(#neonGlow)" />

  <!-- Video Play / AI Generation Prism Indicator -->
  <polygon points="236,236 296,256 236,276" fill="#ffffff" opacity="0.9" filter="url(#neonGlow)" />

  <!-- Ambient Light Sparkle -->
  <circle cx="376" cy="148" r="6" fill="#00f0ff" />
  <circle cx="136" cy="364" r="6" fill="#ec4899" />
</svg>
