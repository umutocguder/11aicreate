name: CI/CD Pipeline

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  verify:
    name: Test & Lint Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Autonomous Backup
        run: npm run backup

      - name: Execute Automated Test Suite
        run: npm test

      - name: Execute Rule 20 Code Quality & Linting
        run: npm run lint
